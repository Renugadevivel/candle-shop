<!DOCTYPE html>
<html>
<head>
    <title>Build Hamper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-banner">
    <h1>Build Your Own Hamper</h1>
    <p>Create a beautiful personalised gift collection.</p>
</div>

<section class="section">

    <div class="heading">
        <h2>Create Your Perfect Gift</h2>
    </div>

    <div class="about-section">
        <div class="about-image">
            <img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=800">
        </div>

        <div class="about-content">
            <h2>A Little Box Full Of Love</h2>
            <p>Select your favourite candles, gift boxes,
            accessories and personalised messages.</p>
        </div>
    </div>

    <form class="contact-form">
        <h2>Your Hamper Details</h2>

        <label>Your Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email Address</label>
        <input type="email" placeholder="Enter email">

        <label>Select Occasion</label>
        <select>
            <option>Wedding</option>
            <option>Engagement</option>
            <option>Birthday</option>
            <option>Anniversary</option>
        </select>

        <label>Select Hamper</label>
        <select>
            <option>Mini Candle Hamper</option>
            <option>Luxury Wedding Hamper</option>
            <option>Premium Gift Box</option>
        </select>

        <label>Quantity</label>
        <input type="number" placeholder="Enter quantity">

        <label>Your Message</label>
        <textarea placeholder="Enter your requirements"></textarea>

        <button class="btn">Submit Enquiry</button>
    </form>

</section>

</body>
</html>
