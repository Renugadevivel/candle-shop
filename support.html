<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-banner">
    <h1>Contact Us</h1>
    <p>We are here to help you.</p>
</div>

<section class="section">

    <div class="features">
        <div>☎<h3>Call Us</h3><p>+91 7810074430</p></div>
        <div>✉<h3>Email Us</h3><p>hello@lumierecandles.in</p></div>
        <div>⌖<h3>Location</h3><p>Bengaluru, India</p></div>
    </div>

    <br><br>

    <form class="contact-form">
        <h2>Send Us A Message</h2>

        <label>Your Name</label>
        <input type="text" placeholder="Your name">

        <label>Email Address</label>
        <input type="email" placeholder="Your email">

        <label>Phone Number</label>
        <input type="tel" placeholder="Your phone number">

        <label>Subject</label>
        <select>
            <option>Wedding Candle Order</option>
            <option>Gift Enquiry</option>
            <option>Delivery Support</option>
            <option>Other</option>
        </select>

        <label>Message</label>
        <textarea placeholder="Write your message"></textarea>

        <button class="btn">SEND MESSAGE</button>
    </form>

</section>

</body>
</html>
